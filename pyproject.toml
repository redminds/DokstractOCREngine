[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dokstract-ocr-engine"
version = "0.1.0"
description = "Dokstract OCR Engine Service with versioned dependency registry"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["workspace_tmp", "workspace_tmp_tests", "__pycache__"]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.api.v1",
    "app.api.v1.routes",
    "app.core",
]
